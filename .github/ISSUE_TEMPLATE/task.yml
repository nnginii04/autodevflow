name: 작업
description: 산출물 작성, 기능 구현, 데이터 구축, 실험 등 계획된 작업
title: "[작업] "
labels: ["type:task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 이 작업이 끝나면 무엇이 달라지는지 한두 문장으로 적습니다.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 할 일
      description: 하루 안에 끝낼 수 있는 단위로 체크리스트를 작성합니다.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      description: 무엇을 확인하면 끝난 것으로 볼지 적습니다.
    validations:
      required: true
  - type: input
    id: related
    attributes:
      label: 관련 업무 ID 또는 문서
      description: "예: T-SUP10-02, docs/01-work-analysis.md 10장"
